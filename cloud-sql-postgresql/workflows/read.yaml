# Reports what the platform believes the current state to be, as action results.
#
# Touches nothing in GCP and needs no credential: build_context only derives
# names and paths from the notification payload, and this workflow never runs
# tofu. It still needs the tfstate bucket to resolve, since build_context
# insists on it for every action. The values reported are what nullplatform
# already holds in the service attributes, not a live read of the instance.
steps:
  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/build_context
    output:
      - name: INSTANCE_NAME
        type: environment
      - name: DATABASE_NAME
        type: environment
      - name: PROJECT_ID
        type: environment
      - name: REGION
        type: environment

  - name: read current state
    type: script
    script: |
      #!/bin/bash
      set -euo pipefail

      HOSTNAME_ATTR=$(echo "$CONTEXT" | jq -r '.service.attributes.hostname // ""')
      PORT_ATTR=$(echo "$CONTEXT" | jq -r '.service.attributes.port // ""')

      RESULTS=$(jq -nc \
        --arg instance_name "${INSTANCE_NAME:-}" \
        --arg hostname      "${HOSTNAME_ATTR}" \
        --arg port          "${PORT_ATTR}" \
        --arg database_name "${DATABASE_NAME:-}" \
        --arg project_id    "${PROJECT_ID:-}" \
        --arg region        "${REGION:-}" \
        '{
          instance_name: $instance_name,
          hostname:      $hostname,
          port:          $port,
          database_name: $database_name,
          project_id:    $project_id,
          region:        $region
        }')

      echo "Reporting current state: $RESULTS"
      np service action update --results "$RESULTS"
