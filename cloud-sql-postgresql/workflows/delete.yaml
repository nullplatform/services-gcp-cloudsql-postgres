# Destroys the Cloud SQL instance.
#
# The tfstate objects (the instance's and every link's) are deliberately left
# behind: removing them would need a gcloud binary the worker image does not
# carry, and an orphaned few-KB object is a far smaller problem than a delete
# action that cannot complete. Clean the cloud-sql-postgresql/<service_id>/
# prefix out of band if it ever matters.
#
# DESTRUCTIVE: deleting the instance deletes the database, every role and all
# their data, and Cloud SQL deletes the automated backups with it. The
# instance name stays reserved for up to a week afterwards.
#
# No credential step: the worker runs as the agent's Kubernetes service account,
# which Workload Identity Federation maps to the GCP permissions the install
# grants it. The google provider and the gcs backend pick that identity up
# through Application Default Credentials.
provider_categories:
  - cloud-providers

steps:
  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/build_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: INSTANCE_NAME
        type: environment
      - name: DATABASE_NAME
        type: environment
      - name: PROJECT_ID
        type: environment
      - name: REGION
        type: environment
      - name: TFSTATE_BUCKET
        type: environment
      - name: TFSTATE_PREFIX
        type: environment

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/do_tofu
    configuration:
      TOFU_ACTION: destroy
