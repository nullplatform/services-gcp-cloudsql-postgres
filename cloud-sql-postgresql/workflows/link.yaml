# Creates the link's PostgreSQL role with grants for its access level, then
# writes the username, password and JDBC URL to the link attributes.
#
# The role is created from inside the worker pod, over TLS, against the
# instance's private IP: the worker must run in the VPC the instance is
# peered with (the agent's own cluster).
#
# No credential step: the worker runs as the agent's Kubernetes service account,
# which Workload Identity Federation maps to the GCP permissions the install
# grants it. The google provider and the gcs backend pick that identity up
# through Application Default Credentials.
provider_categories:
  - cloud-providers

steps:
  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/build_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: INSTANCE_NAME
        type: environment
      - name: DATABASE_NAME
        type: environment
      - name: PROJECT_ID
        type: environment
      - name: REGION
        type: environment
      - name: TFSTATE_BUCKET
        type: environment
      - name: TFSTATE_PREFIX
        type: environment
      - name: LINK_ID
        type: environment
      - name: LINK_NAME
        type: environment
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: SCOPE_SLUG
        type: environment
      - name: APP_SLUG
        type: environment
      - name: APP_NRN
        type: environment
      - name: LINK_ACCESS_LEVEL
        type: environment
      - name: LINK_USERNAME
        type: environment

  - name: build permissions context
    type: script
    file: $SERVICE_PATH/scripts/build_permissions_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      # Set only on the unlink-with-no-instance early exit, so do_tofu and
      # write_link_outputs can no-op instead of inheriting a stale
      # deployment/ TOFU_MODULE_DIR from build_context. Must be declared here
      # or the engine never propagates it to the following steps.
      - name: NP_SKIP_TOFU
        type: environment

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/do_tofu
    configuration:
      TOFU_ACTION: apply

  - name: write link outputs
    type: script
    file: $SERVICE_PATH/scripts/write_link_outputs
