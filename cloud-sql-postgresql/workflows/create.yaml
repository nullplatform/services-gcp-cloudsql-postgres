# Provisions the Cloud SQL instance and its database, then writes hostname,
# port and database name back to the service attributes so linked apps can
# consume them as environment variables.
#
# No credential step: the worker runs as the agent's Kubernetes service account,
# which Workload Identity Federation maps to the GCP permissions the install
# grants it. The google provider and the gcs backend pick that identity up
# through Application Default Credentials.
provider_categories:
  - cloud-providers

steps:
  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/build_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: INSTANCE_NAME
        type: environment
      - name: DATABASE_NAME
        type: environment
      - name: PROJECT_ID
        type: environment
      - name: REGION
        type: environment
      - name: TFSTATE_BUCKET
        type: environment
      - name: TFSTATE_PREFIX
        type: environment

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/do_tofu
    configuration:
      TOFU_ACTION: apply

  - name: write service outputs
    type: script
    file: $SERVICE_PATH/scripts/write_service_outputs
